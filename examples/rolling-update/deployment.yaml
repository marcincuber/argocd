apiVersion: apps/v1
kind: Deployment
metadata:
  name: rolling-update
  labels:
    app.kubernetes.io/name: rolling-update
    app.kubernetes.io/part-of: argocd-local-tutorial
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: rolling-update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rolling-update
        app.kubernetes.io/part-of: argocd-local-tutorial
    spec:
      containers:
        - name: nginx
          image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: rolling-content
