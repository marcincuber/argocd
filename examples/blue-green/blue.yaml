apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
  labels:
    app.kubernetes.io/name: color-demo
    app.kubernetes.io/part-of: argocd-local-tutorial
    tutorial.argocd.io/track: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: color-demo
      tutorial.argocd.io/track: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: color-demo
        app.kubernetes.io/part-of: argocd-local-tutorial
        tutorial.argocd.io/track: blue
    spec:
      containers:
        - name: nginx
          image: nginx:1.31.4-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: blue-content
