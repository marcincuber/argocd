apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitops-heartbeat
  labels:
    app.kubernetes.io/name: gitops-heartbeat
    app.kubernetes.io/part-of: argocd-local-tutorial
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gitops-heartbeat
            app.kubernetes.io/part-of: argocd-local-tutorial
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: heartbeat
              # Multi-platform digest for the official busybox:1.37.0 image.
              image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - date -u '+Argo CD heartbeat at %Y-%m-%dT%H:%M:%SZ'
              resources:
                requests:
                  cpu: 10m
                  memory: 8Mi
                limits:
                  cpu: 50m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
