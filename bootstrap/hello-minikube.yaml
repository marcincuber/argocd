apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-minikube
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: local-tutorial
  source:
    repoURL: https://github.com/marcincuber/argocd.git
    targetRevision: main
    path: examples/hello-app/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-minikube
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        tutorial.argocd.io/environment: local
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5
