apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: local-tutorial
  namespace: argocd
spec:
  description: Restricted project for the local Argo CD tutorial
  sourceRepos:
    - https://github.com/marcincuber/argocd.git
  destinations:
    - namespace: hello-*
      server: https://kubernetes.default.svc
    - namespace: tutorial-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
