name: Validate tutorial

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests-and-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Read pinned versions
        id: versions
        shell: bash
        run: |
          source .versions.env
          echo "kubernetes=${KUBERNETES_VERSION}" >>"${GITHUB_OUTPUT}"
          echo "kubeconform=${KUBECONFORM_VERSION}" >>"${GITHUB_OUTPUT}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: ${{ steps.versions.outputs.kubernetes }}

      - name: Install kubeconform
        shell: bash
        run: |
          version="${{ steps.versions.outputs.kubeconform }}"
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Render and validate
        run: make validate

      - name: Restore Lychee response cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('**/*.md') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          token: ${{ github.token }}
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --host-concurrency 2
            --host-request-interval 1s
            --max-retries 3
            --retry-wait-time 5
            --exclude 'https?://localhost.*'
            --exclude-path './LICENSE'
            './**/*.md'
          fail: true
